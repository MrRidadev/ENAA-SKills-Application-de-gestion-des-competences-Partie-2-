spring.application.name=Api-Gateway
# The Gateway will run on port 8080
server.port=8080


# --- Eureka Client Configuration ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- Dynamic Routing Configuration ---
# This enables automatic routing based on service discovery.
# A request to /AUTH-SERVICE/** will be routed to the auth-service instance.
spring.cloud.gateway.discovery.locator.enabled=true

# --- JWT Secret Configuration ---
# This MUST be the same secret key used in your auth-service
jwt.secret=YourSuperSecretKeyForJWTsThatIsLongAndSecureAndAtLeast256Bits
